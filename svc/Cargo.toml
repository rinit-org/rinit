[package]
name = "rinit-svc"
version = "0.1.0"
authors = ["Danilo Spinella <oss@danyspin97.org>"]
edition = "2021"

[dependencies]
rinit-service = { path = "../service" }
rinit-ipc = { path = "../ipc" }
anyhow = { version = "1.0.96", default-features = false }
async-recursion = "1.1.1"
async-scoped-local = { git = "https://github.com/rinit-org/async-scoped-local", features = [ "use-tokio" ] }
indexmap = "2.7.1"
flexi_logger = { version = "0.29.8", default-features = false, features = ["colors", "compress", "trc", "async"] }
futures = "0.3.31"
lazy_static = "1.5.0"
lexopt = "0.3.0"
libc = "0.2.170"
nix = { version = "0.29.0", features = ["fs"] }
remoc = "0.15.0"
serde_json = "1.0.139"
snafu = "0.8.5"
tokio = { version = "1.43.0", features = [ "macros", "process", "fs", "signal" ] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false }

[[bin]]
name = "rsvc"
path = "src/main.rs"

